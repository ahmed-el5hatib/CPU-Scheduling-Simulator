name: Tests and core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint scheduling core
        run: python -m ruff check src/scheduling
      - name: Type-check scheduling core
        run: python -m mypy src/scheduling
      - name: Run full test suite with core coverage
        run: python -m pytest -q --cov=src/scheduling --cov-report=term-missing --cov-fail-under=99
