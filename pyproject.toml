[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-scheduling-simulator"
version = "1.0.0"
authors = [{ name = "Eng Ahmed El-khatib" }]
description = "Production-Quality Desktop CPU Scheduling Simulator"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
explicit_package_bases = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
